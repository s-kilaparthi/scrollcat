<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScrollCat Icon Generator</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f8; padding: 32px; }
    h1 { font-size: 20px; }
    p { color: #555; }
    .row { display: flex; gap: 24px; align-items: flex-end; margin-top: 24px; }
    .cell { text-align: center; }
    canvas { background: #fff; border: 1px dashed #ccc; image-rendering: pixelated; }
    a.dl { display: block; margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🐱 ScrollCat Icon Generator</h1>
  <p>
    The extension already ships with generated PNGs in <code>icons/</code>.
    Open this page in a browser to regenerate them: right-click a canvas →
    "Save image as…" or use the download links, saving as
    <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code>.
  </p>
  <div class="row" id="row"></div>

  <script>
    function drawCat(canvas) {
      const s = canvas.width;
      const ctx = canvas.getContext('2d');
      const cx = s / 2, cy = s / 2 + s * 0.06, r = s * 0.36;

      ctx.clearRect(0, 0, s, s);
      ctx.fillStyle = '#1a1a1a';

      // Ears
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.85, cy - r * 0.2);
      ctx.lineTo(cx - r * 0.75, cy - r * 1.35);
      ctx.lineTo(cx - r * 0.15, cy - r * 0.75);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.85, cy - r * 0.2);
      ctx.lineTo(cx + r * 0.75, cy - r * 1.35);
      ctx.lineTo(cx + r * 0.15, cy - r * 0.75);
      ctx.closePath();
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#4a90d9';
      const eyeR = Math.max(1, r * 0.16);
      [-1, 1].forEach((side) => {
        ctx.beginPath();
        ctx.arc(cx + side * r * 0.38, cy - r * 0.1, eyeR, 0, Math.PI * 2);
        ctx.fill();
      });

      // Nose
      ctx.fillStyle = '#e97a8a';
      ctx.beginPath();
      ctx.arc(cx, cy + r * 0.25, Math.max(1, r * 0.1), 0, Math.PI * 2);
      ctx.fill();

      // Whiskers (48px and up)
      if (s >= 48) {
        ctx.strokeStyle = '#f0f0f5';
        ctx.lineWidth = Math.max(1, s / 64);
        [-r * 0.12, r * 0.08].forEach((dy) => {
          [-1, 1].forEach((side) => {
            ctx.beginPath();
            ctx.moveTo(cx + side * r * 0.55, cy + r * 0.3 + dy);
            ctx.lineTo(cx + side * (r * 0.55 + r * 0.5), cy + r * 0.3 + dy);
            ctx.stroke();
          });
        });
      }
    }

    const row = document.getElementById('row');
    [16, 48, 128].forEach((size) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      drawCat(canvas);
      cell.appendChild(canvas);
      const link = document.createElement('a');
      link.className = 'dl';
      link.textContent = `Download icon${size}.png`;
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      cell.appendChild(link);
      row.appendChild(cell);
    });
  </script>
</body>
</html>
