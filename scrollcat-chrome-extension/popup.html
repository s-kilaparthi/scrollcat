<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScrollCat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      background: #121218;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: #1a1a2e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    header .logo { font-size: 26px; }
    header h1 { font-size: 16px; font-weight: 700; }
    section {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    h2 {
      font-size: 12px;
      font-weight: 700;
      color: #9999bb;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }
    .key-row { display: flex; gap: 6px; }
    input[type="password"] {
      flex: 1;
      background: #22222e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
    }
    input[type="password"]:focus { border-color: #4a90d9; }
    button {
      background: #4a90d9;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #5aa0e9; }
    button.secondary {
      background: #2a2a3a;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    button.secondary:hover { background: #3a3a4e; }
    .status { margin-top: 8px; font-size: 12px; min-height: 16px; color: #888; }
    .status.ok { color: #6fd08a; }
    .status.err { color: #e97a7a; }
    .radio-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .radio-row label {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #22222e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .radio-row label:has(input:checked) {
      background: #4a90d9;
      border-color: #4a90d9;
    }
    .radio-row input { accent-color: #ffffff; }
    .stats-row { display: flex; gap: 8px; }
    .stat-card {
      flex: 1;
      background: #1e1e2c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat-card .num { font-size: 20px; font-weight: 700; color: #4a90d9; }
    .stat-card .lbl { font-size: 11px; color: #9999bb; margin-top: 2px; }
    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .site-group-header {
      font-size: 11px;
      font-weight: 700;
      color: #7777aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 0 4px;
    }
    .site-group-header:first-child { padding-top: 0; }
    .breakdown { margin-top: 10px; color: #777; font-size: 12px; }
    .breakdown-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      color: #aaaacb;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .switch { position: relative; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #2a2a3a;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider { background: #4a90d9; }
    .switch input:checked + .slider::before { transform: translateX(16px); }
    footer {
      padding: 12px 16px;
      text-align: center;
      color: #666;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🐱</div>
    <h1>ScrollCat</h1>
  </header>

  <section>
    <h2>🔑 Claude API Key</h2>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="sk-ant-..." />
      <button id="saveKey">Save</button>
      <button id="testKey" class="secondary">Test</button>
    </div>
    <div class="status" id="keyStatus"></div>
  </section>

  <section>
    <h2>💬 Reply Tone</h2>
    <div class="radio-row" id="toneRow">
      <label><input type="radio" name="tone" value="friendly" /> Friendly</label>
      <label><input type="radio" name="tone" value="casual" /> Casual</label>
      <label><input type="radio" name="tone" value="professional" /> Professional</label>
    </div>
  </section>

  <section>
    <h2>👤 User Type</h2>
    <div class="radio-row" id="typeRow">
      <label><input type="radio" name="utype" value="creator" /> Creator</label>
      <label><input type="radio" name="utype" value="business" /> Business</label>
      <label><input type="radio" name="utype" value="personal" /> Personal</label>
    </div>
  </section>

  <section>
    <h2>📊 Today</h2>
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="statSuggested">0</div>
        <div class="lbl">Replies suggested</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statUsed">0</div>
        <div class="lbl">Replies used</div>
      </div>
    </div>
    <div id="statBreakdown" class="breakdown"></div>
  </section>

  <section>
    <h2>🌐 Sites</h2>
    <div id="sitesList"></div>
  </section>

  <footer>ScrollCat v1.0 | Made with 🐱</footer>

  <script src="popup.js"></script>
</body>
</html>
